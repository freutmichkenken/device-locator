<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>端末捜索コンソール</title>
<style>
  :root {
    --bg: #12161d;
    --panel: #1a2029;
    --panel-border: #2a3240;
    --amber: #ffb238;
    --amber-dim: #7a5a1f;
    --teal: #4fd1c5;
    --text: #e9e6df;
    --muted: #7c8494;
    --danger: #e0533d;
    --font-display: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN", serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Hiragino Kaku Gothic ProN", monospace;
    --font-body: -apple-system, "Hiragino Sans", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,178,56,0.06), transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 0 0 48px;
  }

  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--panel-border);
    position: relative;
  }

  .lock-again-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 6px 10px;
    cursor: pointer;
  }
  .lock-again-btn:hover { color: var(--text); border-color: var(--muted); }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 8px;
    box-shadow: 0 0 0 0 rgba(79,209,197,0.6);
    animation: pulse-idle 2.4s infinite;
  }

  @keyframes pulse-idle {
    0% { box-shadow: 0 0 0 0 rgba(79,209,197,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(79,209,197,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 26px;
    margin: 8px 0 4px;
    letter-spacing: 0.01em;
  }

  .sub {
    font-size: 13px;
    color: var(--muted);
    max-width: 320px;
    margin: 0 auto;
    line-height: 1.6;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
  }

  .device-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    opacity: 0;
    animation: rise 0.5s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .device-card:nth-child(1) { animation-delay: 0.05s; }
  .device-card:nth-child(2) { animation-delay: 0.12s; }
  .device-card:nth-child(3) { animation-delay: 0.19s; }
  .device-card:nth-child(4) { animation-delay: 0.26s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .device-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .device-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 500;
  }

  .device-card-actions {
    display: flex;
    gap: 4px;
  }

  .device-delete-btn {
    color: var(--danger);
  }
  .device-delete-btn:hover { color: #ff7a63; }

  .device-edit-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    padding: 4px 6px;
  }
  .device-edit-btn:hover { color: var(--text); }

  .device-status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
    min-height: 16px;
  }

  .device-status.sent { color: var(--teal); }
  .device-status.error { color: var(--danger); }

  .send-btn {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    color: #1a1300;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    position: relative;
    transition: transform 0.08s ease, background 0.2s ease;
  }

  .send-btn:active { transform: scale(0.98); }

  .send-btn:disabled {
    background: var(--amber-dim);
    color: rgba(255,255,255,0.5);
    cursor: default;
  }

  .send-btn.sent-flash {
    background: var(--teal);
    color: #05221f;
  }

  .radar-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--amber);
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }

  .radar-ring.active {
    animation: sweep 0.9s ease-out;
  }

  @keyframes sweep {
    0% { width: 10px; height: 10px; opacity: 0.9; }
    100% { width: 340px; height: 340px; opacity: 0; }
  }

  .check-btn {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12.5px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .check-btn:hover { color: var(--text); border-color: var(--teal); }
  .check-btn:disabled { opacity: 0.5; cursor: default; }

  .result-area {
    margin-top: 12px;
  }
  .result-area:empty { margin-top: 0; }

  .result-box {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px;
    animation: rise 0.4s ease forwards;
  }

  .result-photo {
    width: 100%;
    border-radius: 8px;
    display: block;
    margin-bottom: 10px;
    max-height: 220px;
    object-fit: cover;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .result-time {
    color: var(--muted);
  }

  .result-map-link {
    color: var(--teal);
    text-decoration: none;
    font-weight: 700;
    white-space: nowrap;
  }
  .result-map-link:hover { text-decoration: underline; }

  .result-empty {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 8px 0;
    line-height: 1.6;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .add-section {
    margin-top: 24px;
    border-top: 1px solid var(--panel-border);
    padding-top: 20px;
  }

  .add-toggle {
    width: 100%;
    background: none;
    border: 1px dashed var(--panel-border);
    border-radius: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 14px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .add-toggle:hover { color: var(--text); border-color: var(--muted); }

  .add-form {
    display: none;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px;
    margin-top: 12px;
  }
  .add-form.open { display: block; }

  .field-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .field-label:first-child { margin-top: 0; }

  input[type="text"], input[type="url"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  input[type="text"]:focus, input[type="url"]:focus {
    outline: none;
    border-color: var(--amber);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn-primary, .btn-secondary, .btn-danger {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .btn-primary { background: var(--amber); color: #1a1300; font-weight: 700; }
  .btn-primary:disabled { background: var(--amber-dim); cursor: default; }
  .btn-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--muted); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); flex: none; padding: 12px 16px; }

  .storage-note {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.7;
    margin-top: 28px;
    padding: 14px 16px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: rgba(255,255,255,0.015);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-family: var(--font-mono);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ロック画面 */
  #lockScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,178,56,0.08), transparent 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .lock-box {
    width: 100%;
    max-width: 320px;
    text-align: center;
  }

  .lock-icon {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .lock-title {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 24px;
  }

  #lockCodeInput {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.1em;
  }
  #lockCodeInput:focus {
    outline: none;
    border-color: var(--amber);
  }

  .lock-unlock-btn {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    color: #1a1300;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .lock-unlock-btn:disabled {
    background: var(--amber-dim);
    color: rgba(255,255,255,0.5);
  }

  .lock-error {
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
  }

  #appRoot {
    display: none;
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒 LOCKED</div>
    <div class="lock-title">パスコードを入力</div>
    <input type="password" id="lockCodeInput" placeholder="••••••" autocomplete="off">
    <button class="lock-unlock-btn" id="unlockBtn">解除</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="appRoot">

<header>
  <button class="lock-again-btn" id="lockAgainBtn">ロック</button>
  <div class="eyebrow"><span class="status-dot"></span>STANDBY</div>
  <h1>端末捜索コンソール</h1>
  <div class="sub">送信ボタンでMacroDroidを起動し、位置情報と写真をメールで受信。<br>このページ上でも最新の位置情報を確認できます</div>
</header>

<main>
  <div id="deviceList" style="margin-top:0;"></div>

  <div class="add-section">
    <button class="add-toggle" id="addToggleBtn">＋ 端末を追加</button>
    <div class="add-form" id="addForm">
      <label class="field-label">端末名（メールの件名「端末位置情報:」の後ろと同じ名前）</label>
      <input type="text" id="inputName" placeholder="例：K のスマホ">
      <label class="field-label">Webhook URL</label>
      <input type="url" id="inputUrl" placeholder="https://trigger.macrodroid.com/xxxx/xxxx">
      <div class="form-actions">
        <button class="btn-secondary" id="cancelAddBtn">キャンセル</button>
        <button class="btn-primary" id="saveAddBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="storage-note">
    ※ 端末情報・位置情報はGoogleサーバー（Apps Script）に保存されます。ブラウザやアプリの表示状態に関わらず残ります。<br>
    ※ Webhook URL はサーバーにだけ保存し、このページには表示しません。<br>
    ※ パスコードはこのブラウザに保存されます。共用の端末では、使い終わったら右上の「ロック」を押してください。
  </div>
</main>

</div>

<div class="toast" id="toast"></div>

<script>
// このアプリの唯一のバックエンド：GAS WebアプリのURL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwHg1qXOEsvzm1phHmw0bhtWywjFcN3Cs5tc-N-3qVuXwv83lBpr9tC2ktirE_FYTM8/exec';
const WEBHOOK_URL_PREFIX = 'https://trigger.macrodroid.com/';
const SEND_LABEL = '位置情報 + 写真を送信';

let devices = [];
let editingId = null;
let ACCESS_CODE = '';

const lockScreen = document.getElementById('lockScreen');
const appRoot = document.getElementById('appRoot');
const lockCodeInput = document.getElementById('lockCodeInput');
const unlockBtn = document.getElementById('unlockBtn');
const lockError = document.getElementById('lockError');
const lockAgainBtn = document.getElementById('lockAgainBtn');

const deviceListEl = document.getElementById('deviceList');
const addToggleBtn = document.getElementById('addToggleBtn');
const addForm = document.getElementById('addForm');
const inputName = document.getElementById('inputName');
const inputUrl = document.getElementById('inputUrl');
const saveAddBtn = document.getElementById('saveAddBtn');
const cancelAddBtn = document.getElementById('cancelAddBtn');
const toastEl = document.getElementById('toast');

// GASへの呼び出しはすべてPOST（パスコードをURLに載せない）。
// 通信エラーは { status: 'network' } として返す
async function api(action, params = {}, code = ACCESS_CODE) {
  const body = new URLSearchParams({ action, code, ...params });
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });
    const data = await res.json();
    return (data && typeof data === 'object') ? data : { status: 'error' };
  } catch (e) {
    return { status: 'network' };
  }
}

function getStoredCode() {
  try { return localStorage.getItem('accessCode') || ''; } catch (e) { return ''; }
}

function storeCode(code) {
  try { localStorage.setItem('accessCode', code); } catch (e) { /* 保存できない環境では毎回入力が必要になります */ }
}

function clearStoredCode() {
  try { localStorage.removeItem('accessCode'); } catch (e) { /* 何もしない */ }
}

async function boot() {
  const stored = getStoredCode();
  if (stored) {
    const result = await api('getDevices', {}, stored);
    if (result.status === 'ok') {
      ACCESS_CODE = stored;
      devices = result.devices || [];
      showApp();
      return;
    }
    if (result.status === 'unauthorized') clearStoredCode();
  }
  lockScreen.style.display = 'flex';
  lockCodeInput.focus();
}

function showApp() {
  lockScreen.style.display = 'none';
  appRoot.style.display = 'block';
  render();
}

async function attemptUnlock() {
  const code = lockCodeInput.value.trim();
  if (!code) return;

  unlockBtn.disabled = true;
  unlockBtn.textContent = '確認中...';
  lockError.textContent = '';

  const result = await api('getDevices', {}, code);

  if (result.status === 'ok') {
    ACCESS_CODE = code;
    storeCode(code);
    devices = result.devices || [];
    lockCodeInput.value = '';
    showApp();
  } else if (result.status === 'unauthorized') {
    lockError.textContent = 'パスコードが違います';
  } else {
    lockError.textContent = '通信に失敗しました。時間をおいて再度お試しください';
  }

  unlockBtn.disabled = false;
  unlockBtn.textContent = '解除';
}

// この端末に保存したパスコードを消して、ロック画面に戻す
function lockAgain() {
  clearStoredCode();
  ACCESS_CODE = '';
  devices = [];
  deviceListEl.innerHTML = '';
  resetForm();
  appRoot.style.display = 'none';
  lockScreen.style.display = 'flex';
  lockCodeInput.focus();
}

unlockBtn.addEventListener('click', attemptUnlock);
lockCodeInput.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') attemptUnlock();
});
lockAgainBtn.addEventListener('click', lockAgain);

let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  // 続けて呼ばれたとき、前のタイマーで新しいメッセージがすぐ消えないようにする
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// 失敗時の表示文を、GASの応答から組み立てる
function failureMessage(result, fallback) {
  if (result.status === 'unauthorized') return 'パスコードが無効です。右上の「ロック」から入り直してください';
  if (result.status === 'network') return '通信に失敗しました';
  if (result.status === 'busy') return '混み合っています。少し待ってからやり直してください';
  return result.message || fallback;
}

function formatDateTime(iso) {
  const d = new Date(iso);
  // 旧形式（「12:34」だけ）の値はそのまま出す
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function render() {
  if (devices.length === 0) {
    deviceListEl.innerHTML = `<div class="empty-state">まだ端末が登録されていません。<br>下の「＋ 端末を追加」から登録してください。</div>`;
    return;
  }

  deviceListEl.innerHTML = devices.map(d => `
    <div class="device-card" data-id="${escapeHtml(d.id)}">
      <div class="device-row">
        <div class="device-name">${escapeHtml(d.name)}</div>
        <div class="device-card-actions">
          <button class="device-edit-btn" data-action="edit">編集</button>
          <button class="device-edit-btn device-delete-btn" data-action="delete">削除</button>
        </div>
      </div>
      <div class="device-status">${d.lastSent ? '前回送信：' + escapeHtml(formatDateTime(d.lastSent)) : '未送信'}</div>
      <button class="send-btn" data-action="send">
        <span class="radar-ring"></span>
        <span class="btn-label">${SEND_LABEL}</span>
      </button>
      <button class="check-btn" data-action="check">最新の位置情報を確認</button>
      <div class="result-area"></div>
    </div>
  `).join('');
}

// カード内のボタンはイベント委譲で受ける（idをonclickの文字列に埋め込まない）
deviceListEl.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-action]');
  if (!btn) return;
  const card = btn.closest('.device-card');
  if (!card) return;
  const handlers = { edit: startEdit, delete: deleteDevice, send: sendRequest, check: checkStatus };
  const handler = handlers[btn.dataset.action];
  if (handler) handler(card.dataset.id, card);
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  // textContent→innerHTML では " がエスケープされないので、属性値に使えるよう足す
  return div.innerHTML.replace(/"/g, '&quot;');
}

async function sendRequest(id, card) {
  const device = devices.find(d => d.id === id);
  if (!device) return;

  const btn = card.querySelector('.send-btn');
  const ring = card.querySelector('.radar-ring');
  const label = card.querySelector('.btn-label');
  const statusEl = card.querySelector('.device-status');

  btn.disabled = true;
  label.textContent = '送信中...';
  ring.classList.remove('active');
  void ring.offsetWidth;
  ring.classList.add('active');

  const result = await api('trigger', { id });

  statusEl.classList.remove('sent', 'error');
  if (result.status === 'ok') {
    device.lastSent = result.lastSent;
    btn.classList.add('sent-flash');
    label.textContent = '送信しました ✓';
    statusEl.textContent = '前回送信：' + formatDateTime(result.lastSent) +
      (result.lastSentSaved === false ? '（送信時刻は記録できませんでした）' : '');
    statusEl.classList.add('sent');
    showToast(device.name + ' のMacroDroidを起動しました');
  } else {
    label.textContent = '送信失敗';
    statusEl.textContent = 'エラー：' + failureMessage(result, '送信に失敗しました');
    statusEl.classList.add('error');
    showToast('送信に失敗しました');
  }

  setTimeout(() => {
    btn.classList.remove('sent-flash');
    label.textContent = SEND_LABEL;
    btn.disabled = false;
  }, 1800);
}

async function deleteDevice(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;

  const ok = confirm(`「${device.name}」を削除します。よろしいですか？`);
  if (!ok) return;

  const result = await api('deleteDevice', { id });
  if (result.status !== 'ok') {
    showToast(failureMessage(result, '削除に失敗しました'));
    return;
  }

  devices = result.devices;
  render();
  showToast(device.name + ' を削除しました');

  // 編集中だった端末を削除した場合はフォームも閉じる
  if (editingId === id) {
    resetForm();
  }
}

function startEdit(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;
  editingId = id;
  inputName.value = device.name;
  // 保存済みのURLはサーバーから返さないので、空欄のまま保存すると変更しない
  inputUrl.value = '';
  inputUrl.placeholder = '変更しない場合は空欄のまま';
  addForm.classList.add('open');
  saveAddBtn.textContent = '更新';
  addToggleBtn.style.display = 'none';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function resetForm() {
  editingId = null;
  inputName.value = '';
  inputUrl.value = '';
  inputUrl.placeholder = WEBHOOK_URL_PREFIX + 'xxxx/xxxx';
  addForm.classList.remove('open');
  addToggleBtn.style.display = 'block';
  saveAddBtn.textContent = '保存';
}

addToggleBtn.addEventListener('click', () => {
  addForm.classList.add('open');
  addToggleBtn.style.display = 'none';
});

cancelAddBtn.addEventListener('click', resetForm);

saveAddBtn.addEventListener('click', async () => {
  const name = inputName.value.trim();
  const url = inputUrl.value.trim();

  if (!name || (!editingId && !url)) {
    showToast('端末名とURLの両方を入力してください');
    return;
  }
  if (url && !url.startsWith(WEBHOOK_URL_PREFIX)) {
    showToast('URLは ' + WEBHOOK_URL_PREFIX + ' で始まるものを入力してください');
    return;
  }

  saveAddBtn.disabled = true;
  const result = editingId
    ? await api('updateDevice', { id: editingId, name, webhookUrl: url })
    : await api('addDevice', { name, webhookUrl: url });
  saveAddBtn.disabled = false;

  if (result.status !== 'ok') {
    showToast(failureMessage(result, '保存に失敗しました'));
    return;
  }

  devices = result.devices;
  render();
  resetForm();
  showToast('保存しました');
});

function resultBox(inner) {
  return `<div class="result-box">${inner}</div>`;
}

function resultMessage(text) {
  return resultBox(`<div class="result-empty">${escapeHtml(text)}</div>`);
}

async function checkStatus(id, card) {
  const device = devices.find(d => d.id === id);
  if (!device) return;

  const btn = card.querySelector('.check-btn');
  const resultEl = card.querySelector('.result-area');

  btn.disabled = true;
  btn.textContent = '確認中...';

  const result = await api('getStatus', { device: device.name });

  if (result.status === 'notfound') {
    const known = result.knownDevices || [];
    resultEl.innerHTML = resultMessage(known.length
      ? `「${device.name}」の位置情報は届いていません。届いている端末名：${known.join('、')}（端末名をメールの件名と揃えてください）`
      : 'まだ位置情報が届いていません');
  } else if (result.status !== 'ok') {
    resultEl.innerHTML = resultMessage(failureMessage(result, '取得に失敗しました'));
  } else {
    const data = result.record || {};
    const hasLocation = data.lat != null && data.lng != null;
    const mapUrl = hasLocation
      ? `https://www.google.com/maps?q=${encodeURIComponent(data.lat + ',' + data.lng)}`
      : null;
    const photos = (data.photoUrls || [])
      .map(u => `<img class="result-photo" src="${escapeHtml(u)}" alt="端末周辺の写真">`)
      .join('');
    const lines = [];
    if (hasLocation) lines.push('位置：' + formatDateTime(data.locationAt || data.timestamp));
    if (data.photoAt) lines.push('写真：' + formatDateTime(data.photoAt));
    if (data.battery != null) lines.push('電池：' + data.battery + '%');

    resultEl.innerHTML = resultBox(`
      ${photos}
      <div class="result-row">
        <span class="result-time">${escapeHtml(lines.join(' / '))}</span>
        ${mapUrl ? `<a class="result-map-link" href="${escapeHtml(mapUrl)}" target="_blank" rel="noopener">地図で開く →</a>` : ''}
      </div>
    `);
  }

  btn.disabled = false;
  btn.textContent = '最新の位置情報を確認';
}

boot();
</script>
