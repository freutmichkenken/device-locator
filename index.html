<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>端末捜索コンソール</title>
<style>
  :root {
    --bg: #12161d;
    --panel: #1a2029;
    --panel-border: #2a3240;
    --amber: #ffb238;
    --amber-dim: #7a5a1f;
    --teal: #4fd1c5;
    --text: #e9e6df;
    --muted: #7c8494;
    --danger: #e0533d;
    --font-display: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN", serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Hiragino Kaku Gothic ProN", monospace;
    --font-body: -apple-system, "Hiragino Sans", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,178,56,0.06), transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 0 0 48px;
  }

  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--panel-border);
    position: relative;
  }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 8px;
    box-shadow: 0 0 0 0 rgba(79,209,197,0.6);
    animation: pulse-idle 2.4s infinite;
  }

  @keyframes pulse-idle {
    0% { box-shadow: 0 0 0 0 rgba(79,209,197,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(79,209,197,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 26px;
    margin: 8px 0 4px;
    letter-spacing: 0.01em;
  }

  .sub {
    font-size: 13px;
    color: var(--muted);
    max-width: 320px;
    margin: 0 auto;
    line-height: 1.6;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
  }

  .device-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    opacity: 0;
    animation: rise 0.5s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .device-card:nth-child(1) { animation-delay: 0.05s; }
  .device-card:nth-child(2) { animation-delay: 0.12s; }
  .device-card:nth-child(3) { animation-delay: 0.19s; }
  .device-card:nth-child(4) { animation-delay: 0.26s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .device-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .device-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 500;
  }

  .device-card-actions {
    display: flex;
    gap: 4px;
  }

  .device-delete-btn {
    color: var(--danger);
  }
  .device-delete-btn:hover { color: #ff7a63; }

  .device-edit-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    padding: 4px 6px;
  }
  .device-edit-btn:hover { color: var(--text); }

  .device-status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
    min-height: 16px;
  }

  .device-status.sent { color: var(--teal); }
  .device-status.error { color: var(--danger); }

  .send-btn {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    color: #1a1300;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    position: relative;
    transition: transform 0.08s ease, background 0.2s ease;
  }

  .send-btn:active { transform: scale(0.98); }

  .send-btn:disabled {
    background: var(--amber-dim);
    color: rgba(255,255,255,0.5);
    cursor: default;
  }

  .send-btn.sent-flash {
    background: var(--teal);
    color: #05221f;
  }

  .radar-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--amber);
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }

  .radar-ring.active {
    animation: sweep 0.9s ease-out;
  }

  @keyframes sweep {
    0% { width: 10px; height: 10px; opacity: 0.9; }
    100% { width: 340px; height: 340px; opacity: 0; }
  }

  .check-btn {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12.5px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .check-btn:hover { color: var(--text); border-color: var(--teal); }
  .check-btn:disabled { opacity: 0.5; cursor: default; }

  .result-area {
    margin-top: 12px;
  }
  .result-area:empty { margin-top: 0; }

  .result-box {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px;
    animation: rise 0.4s ease forwards;
  }

  .result-photo {
    width: 100%;
    border-radius: 8px;
    display: block;
    margin-bottom: 10px;
    max-height: 220px;
    object-fit: cover;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .result-time {
    color: var(--muted);
  }

  .result-map-link {
    color: var(--teal);
    text-decoration: none;
    font-weight: 700;
  }
  .result-map-link:hover { text-decoration: underline; }

  .result-empty {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 8px 0;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .add-section {
    margin-top: 24px;
    border-top: 1px solid var(--panel-border);
    padding-top: 20px;
  }

  .add-toggle {
    width: 100%;
    background: none;
    border: 1px dashed var(--panel-border);
    border-radius: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 14px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .add-toggle:hover { color: var(--text); border-color: var(--muted); }

  .add-form {
    display: none;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px;
    margin-top: 12px;
  }
  .add-form.open { display: block; }

  .field-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .field-label:first-child { margin-top: 0; }

  input[type="text"], input[type="url"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  input[type="text"]:focus, input[type="url"]:focus {
    outline: none;
    border-color: var(--amber);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn-primary, .btn-secondary, .btn-danger {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .btn-primary { background: var(--amber); color: #1a1300; font-weight: 700; }
  .btn-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--muted); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); flex: none; padding: 12px 16px; }

  .storage-note {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.7;
    margin-top: 28px;
    padding: 14px 16px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: rgba(255,255,255,0.015);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-family: var(--font-mono);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ロック画面 */
  #lockScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,178,56,0.08), transparent 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .lock-box {
    width: 100%;
    max-width: 320px;
    text-align: center;
  }

  .lock-icon {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .lock-title {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 24px;
  }

  #lockCodeInput {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.1em;
  }
  #lockCodeInput:focus {
    outline: none;
    border-color: var(--amber);
  }

  .lock-unlock-btn {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    color: #1a1300;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .lock-unlock-btn:disabled {
    background: var(--amber-dim);
    color: rgba(255,255,255,0.5);
  }

  .lock-error {
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
  }

  #appRoot {
    display: none;
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒 LOCKED</div>
    <div class="lock-title">パスコードを入力</div>
    <input type="password" id="lockCodeInput" placeholder="••••••" autocomplete="off">
    <button class="lock-unlock-btn" id="unlockBtn">解除</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="appRoot">

<header>
  <div class="eyebrow"><span class="status-dot"></span>STANDBY</div>
  <h1>端末捜索コンソール</h1>
  <div class="sub">送信ボタンでMacroDroidを起動し、位置情報と写真をメールで受信。<br>このページ上でも最新の位置情報を確認できます</div>
</header>

<main>
  <div id="deviceList" style="margin-top:0;"></div>

  <div class="add-section">
    <button class="add-toggle" id="addToggleBtn">＋ 端末を追加</button>
    <div class="add-form" id="addForm">
      <label class="field-label">端末名</label>
      <input type="text" id="inputName" placeholder="例：K のスマホ">
      <label class="field-label">Webhook URL</label>
      <input type="url" id="inputUrl" placeholder="https://trigger.macrodroid.com/xxxx/xxxx">
      <div class="form-actions">
        <button class="btn-secondary" id="cancelAddBtn">キャンセル</button>
        <button class="btn-primary" id="saveAddBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="storage-note">
    ※ 端末情報・位置情報はGoogleサーバー（Apps Script）に保存されます。ブラウザやアプリの表示状態に関わらず残ります。<br>
    ※ このページはパスコードで保護されています。ただし静的サイトの仕組み上、完全な防御ではありません（詳細はチャットの説明を参照）。
  </div>
</main>

</div>

<div class="toast" id="toast"></div>

<script>
// このアプリの唯一のバックエンド：GAS WebアプリのURL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwHg1qXOEsvzm1phHmw0bhtWywjFcN3Cs5tc-N-3qVuXwv83lBpr9tC2ktirE_FYTM8/exec';

let devices = [];
let editingId = null;
let ACCESS_CODE = '';

const lockScreen = document.getElementById('lockScreen');
const appRoot = document.getElementById('appRoot');
const lockCodeInput = document.getElementById('lockCodeInput');
const unlockBtn = document.getElementById('unlockBtn');
const lockError = document.getElementById('lockError');

const deviceListEl = document.getElementById('deviceList');
const addToggleBtn = document.getElementById('addToggleBtn');
const addForm = document.getElementById('addForm');
const inputName = document.getElementById('inputName');
const inputUrl = document.getElementById('inputUrl');
const saveAddBtn = document.getElementById('saveAddBtn');
const cancelAddBtn = document.getElementById('cancelAddBtn');
const toastEl = document.getElementById('toast');

function withCode(url) {
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 'code=' + encodeURIComponent(ACCESS_CODE);
}

function getStoredCode() {
  try { return localStorage.getItem('accessCode') || ''; } catch (e) { return ''; }
}

function storeCode(code) {
  try { localStorage.setItem('accessCode', code); } catch (e) { /* 保存できない環境では毎回入力が必要になります */ }
}

// 指定したコードでGASにアクセスできるか確認し、可能ならdevicesを返す。不可ならnullを返す
async function tryUnlock(code) {
  try {
    const res = await fetch(GAS_URL + '?action=getDevices&code=' + encodeURIComponent(code));
    const data = await res.json();
    if (data && data.status === 'unauthorized') return null;
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return undefined; // 通信エラー（パスコードの正誤は不明）
  }
}

async function boot() {
  const stored = getStoredCode();
  if (stored) {
    const result = await tryUnlock(stored);
    if (result !== null && result !== undefined) {
      ACCESS_CODE = stored;
      devices = result;
      showApp();
      return;
    }
  }
  lockScreen.style.display = 'flex';
  lockCodeInput.focus();
}

function showApp() {
  lockScreen.style.display = 'none';
  appRoot.style.display = 'block';
  render();
}

async function attemptUnlock() {
  const code = lockCodeInput.value.trim();
  if (!code) return;

  unlockBtn.disabled = true;
  unlockBtn.textContent = '確認中...';
  lockError.textContent = '';

  const result = await tryUnlock(code);

  if (result === undefined) {
    lockError.textContent = '通信に失敗しました。時間をおいて再度お試しください';
  } else if (result === null) {
    lockError.textContent = 'パスコードが違います';
  } else {
    ACCESS_CODE = code;
    storeCode(code);
    devices = result;
    showApp();
  }

  unlockBtn.disabled = false;
  unlockBtn.textContent = '解除';
}

unlockBtn.addEventListener('click', attemptUnlock);
lockCodeInput.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') attemptUnlock();
});

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2600);
}

async function saveDevices() {
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'action=saveDevices&code=' + encodeURIComponent(ACCESS_CODE) +
            '&payload=' + encodeURIComponent(JSON.stringify(devices))
    });
  } catch (e) {
    showToast('保存に失敗しました');
  }
}

function render() {
  if (devices.length === 0) {
    deviceListEl.innerHTML = `<div class="empty-state">まだ端末が登録されていません。<br>下の「＋ 端末を追加」から登録してください。</div>`;
    return;
  }

  deviceListEl.innerHTML = devices.map(d => `
    <div class="device-card" data-id="${d.id}">
      <div class="device-row">
        <div class="device-name">${escapeHtml(d.name)}</div>
        <div class="device-card-actions">
          <button class="device-edit-btn" onclick="startEdit('${d.id}')">編集</button>
          <button class="device-edit-btn device-delete-btn" onclick="deleteDevice('${d.id}')">削除</button>
        </div>
      </div>
      <div class="device-status" id="status-${d.id}">${d.lastSent ? '前回送信：' + d.lastSent : '未送信'}</div>
      <button class="send-btn" id="btn-${d.id}" onclick="sendRequest('${d.id}')">
        <span class="radar-ring" id="ring-${d.id}"></span>
        <span class="btn-label" id="label-${d.id}">位置情報 + 写真を送信</span>
      </button>
      <button class="check-btn" id="checkbtn-${d.id}" onclick="checkStatus('${d.id}')">最新の位置情報を確認</button>
      <div class="result-area" id="result-${d.id}"></div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function sendRequest(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;

  const btn = document.getElementById('btn-' + id);
  const ring = document.getElementById('ring-' + id);
  const statusEl = document.getElementById('status-' + id);

  btn.disabled = true;
  document.getElementById('label-' + id).textContent = '送信中...';
  ring.classList.remove('active');
  void ring.offsetWidth;
  ring.classList.add('active');

  try {
    fetch(device.webhookUrl,{method:'POST',mode:'no-cors',keepalive:true}).catch(console.error);

    const now = new Date();
    const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    device.lastSent = timeStr;
    await saveDevices();

    btn.classList.add('sent-flash');
    document.getElementById('label-' + id).textContent = '送信しました ✓';
    statusEl.textContent = '前回送信：' + timeStr;
    statusEl.classList.add('sent');
    showToast(device.name + ' に送信リクエストを送りました');

    setTimeout(() => {
      btn.classList.remove('sent-flash');
      document.getElementById('label-' + id).textContent = '位置情報 + 写真を送信';
      btn.disabled = false;
    }, 1800);
  } catch (e) {
    btn.textContent = '送信失敗';
    statusEl.textContent = 'エラー：通信に失敗しました';
    statusEl.classList.add('error');
    showToast('送信に失敗しました。URLを確認してください');
    setTimeout(() => {
      document.getElementById('label-' + id).textContent = '位置情報 + 写真を送信';
      btn.disabled = false;
    }, 1800);
  }
}

async function deleteDevice(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;

  const ok = confirm(`「${device.name}」を削除します。よろしいですか？`);
  if (!ok) return;

  devices = devices.filter(d => d.id !== id);
  await saveDevices();
  render();
  showToast(device.name + ' を削除しました');

  // 編集中だった端末を削除した場合はフォームも閉じる
  if (editingId === id) {
    resetForm();
  }
}

function startEdit(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;
  editingId = id;
  inputName.value = device.name;
  inputUrl.value = device.webhookUrl;
  addForm.classList.add('open');
  saveAddBtn.textContent = '更新';
  addToggleBtn.style.display = 'none';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function resetForm() {
  editingId = null;
  inputName.value = '';
  inputUrl.value = '';
  addForm.classList.remove('open');
  addToggleBtn.style.display = 'block';
  saveAddBtn.textContent = '保存';
}

addToggleBtn.addEventListener('click', () => {
  addForm.classList.add('open');
  addToggleBtn.style.display = 'none';
});

cancelAddBtn.addEventListener('click', resetForm);

saveAddBtn.addEventListener('click', async () => {
  const name = inputName.value.trim();
  const url = inputUrl.value.trim();

  if (!name || !url) {
    showToast('端末名とURLの両方を入力してください');
    return;
  }

  if (editingId) {
    const device = devices.find(d => d.id === editingId);
    device.name = name;
    device.webhookUrl = url;
  } else {
    devices.push({
      id: 'dev_' + Date.now(),
      name: name,
      webhookUrl: url,
      lastSent: null
    });
  }

  await saveDevices();
  render();
  resetForm();
});

async function checkStatus(id) {
  const device = devices.find(d => d.id === id);
  if (!device) return;

  const btn = document.getElementById('checkbtn-' + id);
  const resultEl = document.getElementById('result-' + id);

  btn.disabled = true;
  btn.textContent = '確認中...';

  try {
    const url = GAS_URL + '?device=' + encodeURIComponent(device.name) + '&code=' + encodeURIComponent(ACCESS_CODE);
    const res = await fetch(url);
    const data = await res.json();

    if (data && data.status === 'unauthorized') {
      resultEl.innerHTML = `<div class="result-box"><div class="result-empty">認証エラー。ページを再読み込みしてください</div></div>`;
    } else if (!data || (!data.lat && !data.photoUrl)) {
      resultEl.innerHTML = `<div class="result-box"><div class="result-empty">まだ位置情報が届いていません</div></div>`;
    } else {
      const mapUrl = (data.lat && data.lng)
        ? `https://www.google.com/maps?q=${data.lat},${data.lng}`
        : null;
      const timeStr = data.timestamp
        ? new Date(data.timestamp).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '';

      resultEl.innerHTML = `
        <div class="result-box">
          ${data.photoUrl ? `<img class="result-photo" src="${data.photoUrl}" alt="端末周辺の写真">` : ''}
          <div class="result-row">
            <span class="result-time">${timeStr}</span>
            ${mapUrl ? `<a class="result-map-link" href="${mapUrl}" target="_blank" rel="noopener">地図で開く →</a>` : ''}
          </div>
        </div>
      `;
    }
  } catch (e) {
    resultEl.innerHTML = `<div class="result-box"><div class="result-empty">取得に失敗しました。APIのURLを確認してください</div></div>`;
  }

  btn.disabled = false;
  btn.textContent = '最新の位置情報を確認';
}

boot();
</script>
